<!DOCTYPE html>
<html lang="id">
<head>
  <title>Embed Google Script – Fullscreen</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }

    /* Tombol fullscreen (wajib untuk browser) */
    #fullscreenBtn {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 9999;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      background: #16a34a;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <button id="fullscreenBtn">Full Screen</button>

  <iframe
    src="https://script.google.com/macros/s/AKfycbytcYaBDS-ieQYy6HTetLGzZLAABj_bAJ5DhkJ2htCHgh_bGHDh0m0oGYidKpaclcmpew/exec"
    allowfullscreen>
  </iframe>

  <script>
    document.getElementById("fullscreenBtn").onclick = () => {
      const el = document.documentElement;

      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.msRequestFullscreen) el.msRequestFullscreen();
    };
  </script>

</body>
</html>
